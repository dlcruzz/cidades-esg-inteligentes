# Configuração do Cucumber (lida pelo JUnit Platform)
cucumber.glue=com.esg.cidades.testes
cucumber.plugin=pretty, summary, html:target/relatorios/relatorio-cucumber.html, json:target/relatorios/cucumber.json, junit:target/relatorios/cucumber.xml
