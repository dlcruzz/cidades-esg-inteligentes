# ==========================================
# Configuracao base - Cidades ESG Inteligentes
# Valores sobrescritos por variaveis de ambiente
# ou pelos profiles staging / production
# ==========================================

spring.application.name=cidades-esg-inteligentes
server.port=${SERVER_PORT:8080}

# O profile ativo vem da variavel de ambiente SPRING_PROFILES_ACTIVE
# (lida nativamente pelo Spring Boot): staging | production | test

# Datasource (Postgres via variaveis de ambiente / docker-compose)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cidades_esg}
spring.datasource.username=${DB_USER:esg_user}
spring.datasource.password=${DB_PASSWORD:esg_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator - health check usado pelo docker-compose / pipeline
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
