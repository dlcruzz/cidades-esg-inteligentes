# Profile: PRODUCTION
# ddl-auto=update cria a tabela no primeiro deploy (banco vazio) e
# nunca apaga dados. ("validate" derrubava a aplicacao num banco novo.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.com.esg.cidades=INFO
logging.level.org.springframework.web=WARN
server.error.include-message=never
server.error.include-stacktrace=never
# Em producao nao expomos detalhes internos (banco, disco) no health check
management.endpoint.health.show-details=never
