# Exemplo de ConfigMap/Secret. Copie para configmap-secret.yaml,
# ajuste os valores e NÃO versione o arquivo com dados reais.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cidades-esg-config
data:
  SPRING_PROFILES_ACTIVE: "production"
  DB_HOST: "cidades-esg-db"
  DB_PORT: "5432"
  DB_NAME: "cidades_esg"
---
apiVersion: v1
kind: Secret
metadata:
  name: cidades-esg-secret
type: Opaque
stringData:
  DB_USER: "esg_user"
  DB_PASSWORD: "troque_esta_senha"
  POSTGRES_USER: "esg_user"
  POSTGRES_PASSWORD: "troque_esta_senha"
  POSTGRES_DB: "cidades_esg"
